<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Versao estatica do favicon, exibida ate o JavaScript montar. Usa a cor da
    paleta padrao (redline); depois do primeiro paint o ThemeProvider troca por
    um data-URI com a cor escolhida no painel.
  -->
  <rect width="64" height="64" rx="12" fill="#ff3b30" />
  <text
    x="32"
    y="35"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700"
    fill="#160908"
  >G</text>
</svg>
